name: Lint

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  secret-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Determine Diff Base
        id: diff_base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "base=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          else
            default_branch="${{ github.event.repository.default_branch }}"
            [ -z "$default_branch" ] && default_branch=main
            git fetch --no-tags --depth=1 origin "$default_branch"
            base_ref="$(git merge-base HEAD FETCH_HEAD 2>/dev/null || true)"
            if [ -z "$base_ref" ]; then
              base_ref="$(git rev-list --max-parents=0 HEAD | tail -1)"
            fi
            echo "base=${base_ref}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run CI Secret Scan
        run: bash scripts/ci-secret-scan.sh "${{ steps.diff_base.outputs.base }}" HEAD

  docs-and-scripts:
    runs-on: ubuntu-latest

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v6.0.2

      - name: Set Up Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install Node Lint Dependencies
        run: npm ci

      - name: Run JavaScript, Markdown, and Data Linters
        run: npm run lint

  python:
    runs-on: ubuntu-latest

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v6.0.2

      - name: Set Up uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.11.8"

      - name: Run Python Linter
        run: uvx --from ruff==0.15.12 ruff check .

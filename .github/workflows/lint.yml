name: Lint

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  docs-and-scripts:
    runs-on: ubuntu-latest

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v6

      - name: Set Up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Node Lint Dependencies
        run: npm ci

      - name: Run JavaScript, Markdown, and Data Linters
        run: npm run lint

  python:
    runs-on: ubuntu-latest

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v6

      - name: Set Up uv
        uses: astral-sh/setup-uv@v5

      - name: Run Python Linter
        run: uvx --from ruff==0.15.10 ruff check .
